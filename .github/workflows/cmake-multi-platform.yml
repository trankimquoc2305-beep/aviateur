name: Build Aviateur Windows (MAVLink 14550)

on:
  push:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2025

    steps:
      - uses: actions/checkout@v4

      - name: Tai cac thu vien con (submodules)
        shell: bash
        run: |
          git submodule update --init --recursive -- 3rd/json 3rd/mINI 3rd/SDL 3rd/vecgui
          git submodule update --init -- 3rd/devourer

      - name: Cai thu vien bang vcpkg (lau nhat, 30-60 phut)
        run: |
          git clone https://github.com/Microsoft/vcpkg.git
          cd vcpkg
          .\bootstrap-vcpkg.bat
          .\vcpkg install libusb ffmpeg libsodium
          echo ("VCPKG_ROOT=" + "$PWD") >> $env:GITHUB_ENV

      - name: Cau hinh
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DVECGUI_VULKAN=OFF -S .

      - name: Build
        run: cmake --build build --config Release

      - name: Dong goi
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path build -Recurse -Filter aviateur.exe | Select-Object -First 1
          if (-not $exe) { Write-Error "Khong thay aviateur.exe"; exit 1 }
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item "$($exe.DirectoryName)\*" package -Recurse -Force
          Copy-Item "$env:VCPKG_ROOT\installed\x64-windows\bin\*.dll" package -Force
          if ((Test-Path build\bin\assets) -and -not (Test-Path package\assets)) {
            Copy-Item build\bin\assets package\assets -Recurse -Force
          }
          Get-ChildItem package

      - uses: actions/upload-artifact@v4
        with:
          name: Aviateur_MAVLink_windows
          path: package
